# One-command setup:  docker compose up --build
# Then open http://localhost:3000
#
# The web app uploads audio to the transcription service over HTTP, so the two
# services share no filesystem (and can be deployed independently). The whisper
# model is cached in `hf-cache` so it's only downloaded once.

services:
  transcription:
    build: ./python-service
    environment:
      - WHISPER_MODEL_SIZE=${WHISPER_MODEL_SIZE:-small}
    volumes:
      - hf-cache:/root/.cache/huggingface
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  web:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      # Override values so they're correct inside the Docker network.
      - TRANSCRIPTION_SERVICE_URL=http://transcription:8000
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    volumes:
      - uploads:/app/uploads
    depends_on:
      - transcription
    restart: unless-stopped

volumes:
  uploads:
  hf-cache:
